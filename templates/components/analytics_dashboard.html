<div id="analyticsDashboard" class="analytics-dashboard">
    <div class="dashboard-header">
        <h2 class="dashboard-title">
            <i class="fas fa-chart-bar"></i>
            Traffic Analytics Dashboard
        </h2>
        <button class="close-dashboard" onclick="hideAnalyticsDashboard()">&times;</button>
    </div>

    <div style="margin-bottom: 20px; text-align: center;">
        <button onclick="downloadComprehensiveData()" class="btn" style="background: var(--success);">
            <i class="fas fa-download"></i>
            Download Comprehensive Traffic Report
        </button>
        <p style="margin-top: 10px; font-size: 0.9rem; color: var(--text-secondary);">
            Export complete traffic analysis data as CSV
        </p>
    </div>

    <div class="analytics-stats">
        <div class="analytics-stat">
            <div class="value" id="dashboard-total-roads">...</div>
            <div class="label">Total Roads Monitored</div>
        </div>
        <div class="analytics-stat" style="background: var(--success);">
            <div class="value" id="dashboard-avg-speed">...</div>
            <div class="label">Average Speed (km/h)</div>
        </div>
        <div class="analytics-stat" style="background: var(--warning);">
            <div class="value" id="dashboard-avg-congestion">...</div>
            <div class="label">Average Congestion</div>
        </div>
        <div class="analytics-stat" style="background: var(--danger);">
            <div class="value" id="dashboard-peak-congestion">...</div>
            <div class="label">Peak Hour Congestion</div>
        </div>
    </div>

    <div class="charts-accordion">
        <!-- Congestion Distribution -->
        <div class="chart-section">
            <div class="chart-section-header" onclick="toggleChartSection(this)">
                <div class="chart-section-title">
                    <i class="fas fa-chart-pie"></i>
                    Congestion Distribution
                </div>
                <div class="chart-section-actions">
                    <button class="chart-download-btn" onclick="event.stopPropagation(); downloadChart('congestionChart', 'congestion_distribution')" title="Download Chart">
                        <i class="fas fa-download"></i>
                    </button>
                    <i class="fas fa-chevron-down chart-toggle-icon"></i>
                </div>
            </div>
            <div class="chart-section-content expanded">
                <canvas id="congestionChart"></canvas>
            </div>
        </div>

        <!-- Traffic Patterns by Hour -->
        <div class="chart-section">
            <div class="chart-section-header" onclick="toggleChartSection(this)">
                <div class="chart-section-title">
                    <i class="fas fa-clock"></i>
                    Traffic Patterns by Hour
                </div>
                <div class="chart-section-actions">
                    <button class="chart-download-btn" onclick="event.stopPropagation(); downloadChart('hourlyPatternChart', 'hourly_traffic_patterns')" title="Download Chart">
                        <i class="fas fa-download"></i>
                    </button>
                    <i class="fas fa-chevron-down chart-toggle-icon"></i>
                </div>
            </div>
            <div class="chart-section-content expanded">
                <canvas id="hourlyPatternChart"></canvas>
            </div>
        </div>

        <!-- Road Types Analysis -->
        <div class="chart-section">
            <div class="chart-section-header" onclick="toggleChartSection(this)">
                <div class="chart-section-title">
                    <i class="fas fa-road"></i>
                    Road Types Analysis
                </div>
                <div class="chart-section-actions">
                    <button class="chart-download-btn" onclick="event.stopPropagation(); downloadChart('roadTypeChart', 'road_types_analysis')" title="Download Chart">
                        <i class="fas fa-download"></i>
                    </button>
                    <i class="fas fa-chevron-down chart-toggle-icon"></i>
                </div>
            </div>
            <div class="chart-section-content expanded">
                <canvas id="roadTypeChart"></canvas>
            </div>
        </div>

        <!-- Weekly Traffic Trends -->
        <div class="chart-section">
            <div class="chart-section-header" onclick="toggleChartSection(this)">
                <div class="chart-section-title">
                    <i class="fas fa-calendar-week"></i>
                    Weekly Traffic Trends
                </div>
                <div class="chart-section-actions">
                    <button class="chart-download-btn" onclick="event.stopPropagation(); downloadChart('weeklyTrendChart', 'weekly_traffic_trends')" title="Download Chart">
                        <i class="fas fa-download"></i>
                    </button>
                    <i class="fas fa-chevron-down chart-toggle-icon"></i>
                </div>
            </div>
            <div class="chart-section-content expanded">
                <canvas id="weeklyTrendChart"></canvas>
            </div>
        </div>
    </div>

    <div class="peak-hours">
        <h3>🚦 Peak Traffic Hours</h3>
        <div id="peakHoursList">
            <!-- Peak hours will be populated here -->
        </div>
    </div>
</div>
